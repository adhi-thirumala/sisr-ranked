plugins {
    id 'net.fabricmc.fabric-loom' version '1.15.5'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "sisr" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

def matchImageContext = layout.buildDirectory.dir("match-image")
def matchModJar = layout.buildDirectory.file("libs/${project.archives_base_name}-${project.version}.jar")

def projectValue = { String camelName, String snakeName, String envName, String fallback ->
    def value = findProperty(camelName)
    if (value == null) value = findProperty(snakeName)
    if (value == null) value = System.getenv(envName)
    if (value == null || value.toString().isBlank()) return fallback
    return value.toString()
}

def imageBuilderCommand = {
    projectValue('imageBuilder', 'image_builder', 'IMAGE_BUILDER', 'podman')
}

def matchImageName = {
    projectValue('matchImage', 'match_image', 'MATCH_IMAGE', "localhost/rir-game:${project.version}")
}

def minecraftServerImageName = {
    projectValue('minecraftServerImage', 'minecraft_server_image', 'MINECRAFT_SERVER_IMAGE', 'docker.io/itzg/minecraft-server:java25')
}

def extraModUrls = {
    projectValue('extraModUrls', 'extra_mod_urls', 'EXTRA_MOD_URLS', '')
}

def ghcrImageName = {
    def value = findProperty('ghcrImage') ?: findProperty('ghcr_image') ?: System.getenv('GHCR_IMAGE')
    if (value == null || value.toString().isBlank()) {
        def owner = findProperty('ghcrOwner') ?: findProperty('ghcr_owner') ?: System.getenv('GITHUB_REPOSITORY_OWNER')
        if (owner == null || owner.toString().isBlank()) {
            throw new GradleException('Set -PghcrImage=ghcr.io/<owner>/rir-game or -PghcrOwner=<owner> before running pushMatchImage')
        }
        value = "ghcr.io/${owner}/rir-game"
    }
    return value.toString().toLowerCase(java.util.Locale.ROOT)
}

def imageTagNames = {
    projectValue('imageTags', 'image_tags', 'IMAGE_TAGS', "${project.version},latest")
        .split(',')
        .collect { it.trim() }
        .findAll { !it.isEmpty() }
}

tasks.register('prepareMatchImageContext', Copy) {
    group = 'container'
    description = 'Prepares build/match-image with the Containerfile and mod jar.'
    dependsOn tasks.matching { it.name == 'remapJar' || it.name == 'jar' }
    into(matchImageContext)
    doFirst {
        delete matchImageContext
    }
    from('src/main/container') {
        include 'Containerfile'
    }
    from(matchModJar) {
        into 'mods'
        rename { 'sisr-mod.jar' }
    }
}

tasks.named('build') {
    dependsOn tasks.named('prepareMatchImageContext')
}

tasks.register('buildMatchImage', Exec) {
    group = 'container'
    description = 'Builds the Fabric match server image with Podman or Docker.'
    dependsOn tasks.named('prepareMatchImageContext')
    doFirst {
        def contextDir = matchImageContext.get().asFile
        commandLine imageBuilderCommand(), 'build',
                '-f', new File(contextDir, 'Containerfile').absolutePath,
                '--build-arg', "MINECRAFT_SERVER_IMAGE=${minecraftServerImageName()}",
                '--build-arg', "MINECRAFT_VERSION=${project.minecraft_version}",
                '--build-arg', "FABRIC_LOADER_VERSION=${project.loader_version}",
                '--build-arg', "EXTRA_MOD_URLS=${extraModUrls()}",
                '-t', matchImageName(),
                contextDir.absolutePath
    }
}

tasks.register('pushMatchImage') {
    group = 'container'
    description = 'Tags and pushes the match server image to GHCR.'
    dependsOn tasks.named('buildMatchImage')
    doLast {
        def builder = imageBuilderCommand()
        def sourceImage = matchImageName()
        def registryImage = ghcrImageName()
        imageTagNames().each { tag ->
            def targetImage = "${registryImage}:${tag}"
            exec { commandLine builder, 'tag', sourceImage, targetImage }
            exec { commandLine builder, 'push', targetImage }
        }
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
