name: Match Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'sisr-mod/**'
      - '.github/workflows/match-image.yml'
  pull_request:
    paths:
      - 'sisr-mod/**'
      - '.github/workflows/match-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image name
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/rir-game" >> "$GITHUB_OUTPUT"

      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' && (github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch) }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=ref,event=pr

      - name: Set architecture image tags
        if: github.event_name != 'pull_request'
        id: arch_meta
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.image.outputs.name }}"
          short_sha="${GITHUB_SHA::7}"

          write_tags() {
            local output="$1"
            shift
            {
              echo "${output}<<EOF"
              printf '%s\n' "$@"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          }

          amd64_tags=("${image}:sha-${short_sha}-amd64" "${image}:sha-${short_sha}-x86")
          arm64_tags=("${image}:sha-${short_sha}-arm64")

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            amd64_tags+=("${image}:${version}-amd64" "${image}:${version}-x86" "${image}:latest-amd64" "${image}:latest-x86")
            arm64_tags+=("${image}:${version}-arm64" "${image}:latest-arm64")
          elif [[ "${GITHUB_REF_NAME}" == "${{ github.event.repository.default_branch }}" ]]; then
            amd64_tags+=("${image}:latest-amd64" "${image}:latest-x86")
            arm64_tags+=("${image}:latest-arm64")
          fi

          write_tags amd64_tags "${amd64_tags[@]}"
          write_tags arm64_tags "${arm64_tags[@]}"

      - name: Read build args
        id: match_args
        shell: bash
        run: |
          set -euo pipefail
          minecraft_server_image="docker.io/itzg/minecraft-server:java25"

          while IFS='=' read -r key value; do
            case "$key" in
              minecraft_version) minecraft_version="$value" ;;
              loader_version) loader_version="$value" ;;
              minecraft_server_image) minecraft_server_image="$value" ;;
            esac
          done < sisr-mod/gradle.properties

          : "${minecraft_version:?missing minecraft_version in sisr-mod/gradle.properties}"
          : "${loader_version:?missing loader_version in sisr-mod/gradle.properties}"

          echo "minecraft_version=${minecraft_version}" >> "$GITHUB_OUTPUT"
          echo "fabric_loader_version=${loader_version}" >> "$GITHUB_OUTPUT"
          echo "minecraft_server_image=${minecraft_server_image}" >> "$GITHUB_OUTPUT"

      - name: Prepare match image context
        working-directory: sisr-mod
        run: ./gradlew prepareMatchImageContext

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push match image
        uses: docker/build-push-action@v6
        with:
          context: ./sisr-mod/build/match-image
          file: ./sisr-mod/build/match-image/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MINECRAFT_SERVER_IMAGE=${{ steps.match_args.outputs.minecraft_server_image }}
            MINECRAFT_VERSION=${{ steps.match_args.outputs.minecraft_version }}
            FABRIC_LOADER_VERSION=${{ steps.match_args.outputs.fabric_loader_version }}
          cache-from: type=gha,scope=match-image
          cache-to: type=gha,mode=max,scope=match-image

      - name: Build and push match image x86 tags
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./sisr-mod/build/match-image
          file: ./sisr-mod/build/match-image/Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.arch_meta.outputs.amd64_tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MINECRAFT_SERVER_IMAGE=${{ steps.match_args.outputs.minecraft_server_image }}
            MINECRAFT_VERSION=${{ steps.match_args.outputs.minecraft_version }}
            FABRIC_LOADER_VERSION=${{ steps.match_args.outputs.fabric_loader_version }}
          cache-from: type=gha,scope=match-image

      - name: Build and push match image arm64 tags
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./sisr-mod/build/match-image
          file: ./sisr-mod/build/match-image/Containerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.arch_meta.outputs.arm64_tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MINECRAFT_SERVER_IMAGE=${{ steps.match_args.outputs.minecraft_server_image }}
            MINECRAFT_VERSION=${{ steps.match_args.outputs.minecraft_version }}
            FABRIC_LOADER_VERSION=${{ steps.match_args.outputs.fabric_loader_version }}
          cache-from: type=gha,scope=match-image
